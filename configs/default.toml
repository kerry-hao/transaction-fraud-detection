seed = 42
data_dir = "data/raw"
output_dir = "artifacts"

[split]
# Fractions of unique observed relative days, not fractions of rows.
train_fraction = 0.60
tune_fraction = 0.20

[features]
# Only constant/all-missing columns are removed, using training rows alone.
group_columns = ["card1", "card4", "addr1", "P_emaildomain"]

[models]
names = ["logistic_baseline", "lightgbm_baseline", "lightgbm_engineered"]
selection_metric = "roc_auc"

[logistic]
C = 0.1
max_iter = 1000
min_frequency = 25
max_categories = 100

[lightgbm]
n_estimators = 2000
learning_rate = 0.04
num_leaves = 63
min_child_samples = 100
colsample_bytree = 0.8
subsample = 0.8
subsample_freq = 1
reg_alpha = 0.1
reg_lambda = 1.0
n_jobs = 4
early_stopping_rounds = 100
